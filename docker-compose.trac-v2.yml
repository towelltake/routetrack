services:
  mysql:
    image: mariadb:10.4
    environment:
      MARIADB_ROOT_PASSWORD: tracroot
      MARIADB_DATABASE: trac
      MYSQL_ROOT_PASSWORD: tracroot
      MYSQL_DATABASE: trac
    command:
      - --max_allowed_packet=512M
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - /Users/jyothishthyagarajan/Downloads:/docker-mysql-seed:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptracroot"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  trac-v2:
    build:
      context: .
    image: trac-v2:latest
    env_file:
      - .env.docker
    ports:
      - "8001:8000"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/login') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql-data:
