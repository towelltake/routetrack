appId: com.towellgroup.journeyplan
productName: Journey Plan App
copyright: Copyright © 2026 Towell Group
directories:
  output: ../installer
  buildResources: build
files:
  - out/**/*
  - package.json
  # OSRM runtime DLLs (tbb12, tbbmalloc) bundled via files+asarUnpack as a
  # belt-and-braces backup. On 2026-05-18 we saw a fresh install drop these
  # DLLs from resources/osrm/bin/ (root cause unclear — suspected Defender or
  # NSIS interference with unsigned DLLs at that path). osrm.ts copies them
  # from this asar-unpacked location into the bin dir at startup if missing,
  # so future installs self-heal. Total cost: ~500 KB shipped twice.
  - runtime-deps/osrm/**/*
asarUnpack:
  - "**/*.node"      # native modules (better-sqlite3, keytar) need to live outside asar
  - runtime-deps/osrm/**/*  # DLL backup — must be on disk for fs.copyFileSync at startup
extraResources:
  - from: src/main/migrations
    to: migrations
    filter: ["**/*.sql"]
  - from: ../sidecar/dist/sidecar.exe
    to: sidecar/sidecar.exe
  # OSRM binaries + GCC-states MLD graph. Required for the matrix backend
  # that replaced Google Distance Matrix. Generated by sidecar/scripts/setup-osrm.ps1
  # which downloads OSRM v26.5.0 from the official Project-OSRM GitHub release
  # + Intel oneTBB v2023.0.0 (for tbb12.dll / tbbmalloc.dll runtime), then
  # preprocesses the Geofabrik GCC-states extract (Oman + UAE + KSA + Bahrain
  # + Qatar + Kuwait, ~240 MB compressed). Final installer bundle adds ~1.5 GB
  # (binaries small; graph + node files are the size sink). Installer grows
  # from 162 MB to ~1.7 GB. Larger than initially scoped, but $0 matrix cost
  # justifies the size for a desktop-only app.
  - from: ../sidecar/osrm/bin
    to: osrm/bin
  - from: ../sidecar/osrm/graph
    to: osrm/graph
  - from: ../sidecar/osrm/profiles
    to: osrm/profiles
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: JourneyPlanApp-Setup-${version}.${ext}
  # Multi-resolution icon (16/24/32/48/64/128/256) for taskbar, titlebar,
  # Alt-Tab, .exe shell, Start Menu + desktop shortcuts. Generated from
  # docs/brand/logo-source.png via `pnpm icon` (scripts/build-icon.cjs).
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Journey Plan App
  # Same brand icon for the setup .exe and the uninstaller .exe — they live
  # next to each other in the installed dir and we don't want a default
  # electron-builder fallback icon next to the branded app.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Preserve user data (SQLite DB, error.log) across uninstall + reinstall.
  # Critical because the DB carries every plan,
  # customer dataset, and matrix-cache the user has built up. Without this an
  # installer upgrade would wipe their state. Default is already false but we
  # set it explicitly to document intent and lock against any future change.
  deleteAppDataOnUninstall: false
asar: true
