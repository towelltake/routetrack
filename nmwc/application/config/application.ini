[bootstrap]
    Autoloadernamespaces[] = "Zend_"
    Autoloadernamespaces[] = "Custom_"
    Autoloadernamespaces[] = "Home_"
    Autoloadernamespaces[] = "SFA_"
    
    ;someservice.apikey  = 12345678
    
    resources.frontController.moduleDirectory = APPLICATION_PATH"/modules"
    resources.frontController.defaultModule = "home"
    resources.frontController.throwErrors = false
    resources.modules[] = ""
    resources.layout.layout = "layout"
    resources.layout.pluginClass = "Custom_Controller_Plugin_ModuleBasedLayout"
    resources.view.encoding = "UTF-8"
    resources.view.basePath = APPLICATION_PATH "/views/"
    resources.view.helperPath.Custom_View_Helper = APPLICATION_PATH "/library/Custom/View/Helper"
    
    bootstrap.path = APPLICATION_PATH "/Bootstrap.php"
    bootstrap.class = "Bootstrap"
    
   
    resources.multidb.front_db.adapter  = "pdo_mysql"
    resources.multidb.front_db.host     = localhost
	
    resources.multidb.front_db.username = root
    resources.multidb.front_db.password = 
    
    resources.multidb.front_db.dbname   = sfa_nmwc
    resources.multidb.front_db.default  = true
    
    resources.multidb.front_db.db_credential    = "/db_structure/DB_Credential.sql"
    resources.multidb.front_db.db_filename      = "/db_structure/DB_Structure.sql"    
    resources.multidb.front_db.mysql_path       = "C:/wamp/bin/mysql/mysql5.5.24/bin/mysql.exe"
    
    
    errorhandler.class = "Zend_Controller_Plugin_ErrorHandler"
    errorhandler.options.module = default
    errorhandler.options.controller = error
    errorhandler.options.action = error 
    
    constants.RP_NOOFRECORDSHOW = "100"
    constants.RP_ROWLISTSHOW = "[100,500,1000]"
    
    
    cache.db.adaptor.path = CACHE_PATH "/db/adaptor"
    cache.db.adaptor.result_lifetime = 1000
    
[production : bootstrap]

    resources.multidb.front_db.profiler.enabled = false
    resources.multidb.front_db.profiler.class   = "Zend_Db_Profiler_Firebug"

    resources.frontController.throwErrors = true    
    phpSettings.display_startup_errors  = 1	
    phpSettings.display_errors          = 1
    settings.debug.enabled              = true
    
    settings.application.datetime = "Etc/GMT-8"
    
[qa : production]
    
    resources.multidb.front_db.profiler.enabled = false
    resources.multidb.front_db.profiler.class   = "Zend_Db_Profiler_Firebug"

    resources.frontController.throwErrors = true    
    phpSettings.display_startup_errors  = 1	
    phpSettings.display_errors          = 1
    settings.debug.enabled              = true
    
    settings.application.datetime = "Etc/GMT-8"
    
[testing : qa]

    resources.frontController.throwErrors = true    
    phpSettings.display_startup_errors  = 1	
    phpSettings.display_errors          = 1
    settings.debug.enabled              = true
    
    settings.application.datetime = "Etc/GMT-8"
    
    resources.multidb.front_db.profiler.enabled = true
    resources.multidb.front_db.profiler.class   = "Zend_Db_Profiler_Firebug"
    
[development : testing]

    phpSettings.display_startup_errors = 1
    phpSettings.display_errors         = 1
    resources.frontController.throwErrors = true
    
    settings.application.datetime = "Europe/Bucharest"
    
    resources.multidb.front_db.profiler.enabled = true
    resources.multidb.front_db.profiler.class   = "Zend_Db_Profiler_Firebug"